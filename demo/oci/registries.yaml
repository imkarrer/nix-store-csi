# Three registries with TLS from the demo CA and htpasswd logins. Pods name
# them as registry-{a,b,c}.registries.svc, on port 443.
apiVersion: v1
kind: Namespace
metadata:
  name: registries
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-NAME
  namespace: registries
spec:
  selector:
    matchLabels:
      app: registry-NAME
  template:
    metadata:
      labels:
        app: registry-NAME
    spec:
      containers:
        - name: registry
          image: docker.io/library/registry:3
          env:
            - name: REGISTRY_HTTP_ADDR
              value: ":5000"
            - name: REGISTRY_HTTP_TLS_CERTIFICATE
              value: /certs/tls.crt
            - name: REGISTRY_HTTP_TLS_KEY
              value: /certs/tls.key
            - name: REGISTRY_AUTH
              value: htpasswd
            - name: REGISTRY_AUTH_HTPASSWD_REALM
              value: demo
            - name: REGISTRY_AUTH_HTPASSWD_PATH
              value: /auth/htpasswd
            - name: OTEL_TRACES_EXPORTER
              value: none
          ports:
            - containerPort: 5000
          readinessProbe:
            tcpSocket:
              port: 5000
          volumeMounts:
            - name: certs
              mountPath: /certs
            - name: auth
              mountPath: /auth
      volumes:
        - name: certs
          secret:
            secretName: registry-tls
        - name: auth
          secret:
            secretName: registry-htpasswd
---
apiVersion: v1
kind: Service
metadata:
  name: registry-NAME
  namespace: registries
spec:
  selector:
    app: registry-NAME
  ports:
    - port: 443
      targetPort: 5000
